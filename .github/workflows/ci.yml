name: CI
on:
  pull_request:
  push:
    branches: [main, integration/mvp]
permissions:
  contents: read
jobs:
  backend:
    name: Backend shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # Every matrix entry has its own runner and disposable PostgreSQL container.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: serentable
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: serentable_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U serentable -d serentable_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://serentable:ci-only@127.0.0.1:5432/serentable_test
      TEST_DATABASE_URL: postgresql://serentable:ci-only@127.0.0.1:5432/serentable_test
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.1'
          python-version: '3.12'
          enable-cache: true
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
      - run: uv sync --locked
      - run: uv run ruff check backend tests migrations scripts/ci_pytest.py
      - run: uv run ruff format --check backend tests migrations scripts/ci_pytest.py
      - run: uv run alembic upgrade head
      - name: Run complete pytest partition with timings
        run: >-
          uv run python scripts/ci_pytest.py --shard ${{ matrix.shard }} --shards 4 --
          -q --durations=25 --junitxml=pytest-shard-${{ matrix.shard }}.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-shard-${{ matrix.shard }}
          path: pytest-shard-${{ matrix.shard }}.xml
          if-no-files-found: warn
          retention-days: 7

  browser:
    name: Browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: serentable
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: serentable_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U serentable -d serentable_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://serentable:ci-only@127.0.0.1:5432/serentable_test
      TEST_DATABASE_URL: postgresql://serentable:ci-only@127.0.0.1:5432/serentable_test
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.1'
          python-version: '3.12'
          enable-cache: true
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
      - run: uv sync --locked
      - run: uv run alembic upgrade head
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e --prefix frontend

  recovery:
    name: Runtime image and PostgreSQL 18 recovery
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.1'
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --locked
      - name: Build runtime image
        run: docker build --tag serentable:ci .
      - name: Verify isolated PostgreSQL 18 backup and restore
        env:
          RECOVERY_APP_IMAGE: serentable:ci
        run: |
          uv run ruff check scripts/postgres_recovery.py scripts/verify_postgres_recovery.py
          uv run ruff format --check scripts/postgres_recovery.py scripts/verify_postgres_recovery.py
          uv run python scripts/verify_postgres_recovery.py

  # Keep the existing required check name. Failure/cancellation/skipping must not go green.
  verify:
    if: always()
    needs: [backend, browser, recovery]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every verification job to succeed
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          RECOVERY_RESULT: ${{ needs.recovery.result }}
        run: |
          set -eu
          test "$BACKEND_RESULT" = success
          test "$BROWSER_RESULT" = success
          test "$RECOVERY_RESULT" = success
