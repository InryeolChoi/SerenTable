<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
<title id="title">원본 응답의 비공개 준비 DB</title><desc id="desc">배치와 응답은 일대다이며 앱 사용자와 거래로 연결되지 않는다.</desc>
<rect width="1200" height="460" fill="#fff9ed"/>
<g font-family="sans-serif" fill="#442b1a">
<text x="35" y="42" font-size="24">별도 로컬 준비 DB · source_private · 원문/가명 복제 없음</text>
<rect x="35" y="85" width="470" height="200" rx="12" fill="white" stroke="#9a5a2e" stroke-width="2"/>
<text x="55" y="120" font-size="22">import_batch</text>
<text x="55" y="158" font-size="18">PK id · source_sha256 · rules_version</text>
<text x="55" y="193" font-size="18">UNIQUE (source_sha256, rules_version)</text>
<text x="55" y="228" font-size="18">response_count · imported_at</text>
<path d="M505 180 H650" fill="none" stroke="#9a5a2e" stroke-width="3"/>
<text x="540" y="165" font-size="18">1 : N</text>
<rect x="650" y="85" width="510" height="200" rx="12" fill="white" stroke="#9a5a2e" stroke-width="2"/>
<text x="670" y="120" font-size="22">response_staging</text>
<text x="670" y="158" font-size="18">PK/FK batch_id · PK sheet_name</text>
<text x="670" y="193" font-size="18">PK source_row_number</text>
<text x="670" y="228" font-size="18">normalized_data JSONB · review_codes JSONB</text>
<rect x="35" y="330" width="1125" height="95" rx="12" fill="#f3ece2" stroke="#85715d" stroke-dasharray="8 5"/>
<text x="55" y="365" font-size="20">앱 DB: app_user · participant_profile · application · payment · consent_record</text>
<text x="55" y="400" font-size="18">자동 연결/생성 없음 · 이름으로 사용자 병합 없음 · 운영 적재/데모 계정 생성은 후속 승인</text>
</g></svg>
